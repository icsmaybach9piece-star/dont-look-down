name: Build Don't Look Down GBA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean any stale build artifacts
        run: |
          rm -rf build
          rm -f DLD.gba DLD.elf

      - name: Build GBA ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make

      - name: Verify ROM exists and has size
        run: |
          ls -lh DLD.gba
          SIZE=$(stat -c%s DLD.gba)
          echo "ROM size: $SIZE bytes"
          if [ "$SIZE" -lt 32768 ]; then
            echo "ERROR: ROM is only $SIZE bytes — should be at least 32KB"
            exit 1
          fi
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: DONT-LOOK-DOWN-GBA
          path: DLD.gba
